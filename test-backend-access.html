<!DOCTYPE html>
<html>
<head>
    <title>Test d'accès au Backend</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; }
    </style>
</head>
<body>
    <h1>Test d'accès au Backend</h1>
    
    <div class="test">
        <h2>1. Test de connexion simple</h2>
        <button onclick="testConnection()">Tester la connexion au backend</button>
        <div id="connection-result"></div>
    </div>
    
    <div class="test">
        <h2>2. Test de l'API login</h2>
        <button onclick="testLoginAPI()">Tester l'API login</button>
        <div id="login-result"></div>
    </div>
    
    <div class="test">
        <h2>3. Test de l'API livres</h2>
        <button onclick="testBooksAPI()">Tester l'API livres</button>
        <div id="books-result"></div>
    </div>

    <script>
        const API_BASE = 'https://mabiblioth-queenligne.onrender.com/api';
        
        async function testConnection() {
            const resultDiv = document.getElementById('connection-result');
            resultDiv.innerHTML = 'Test en cours...';
            
            try {
                // Test simple avec fetch
                const response = await fetch(API_BASE + '/livres?limit=1');
                
                resultDiv.innerHTML = `
                    <div class="${response.ok ? 'success' : 'error'}">
                        Connexion réussie !
                        <br>Statut: ${response.status}
                        <br>URL: ${API_BASE}/livres?limit=1
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        Erreur de connexion: ${error.message}
                        <br>Vérifiez que le backend est bien déployé et accessible.
                    </div>
                `;
            }
        }
        
        async function testLoginAPI() {
            const resultDiv = document.getElementById('login-result');
            resultDiv.innerHTML = 'Test en cours...';
            
            try {
                const response = await fetch(API_BASE + '/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test@test.com',
                        motDePasse: 'test123'
                    })
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="${response.ok ? 'success' : 'error'}">
                        Statut: ${response.status}
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        Erreur: ${error.message}
                        <br>Ceci est probablement une erreur CORS ou réseau.
                    </div>
                `;
            }
        }
        
        async function testBooksAPI() {
            const resultDiv = document.getElementById('books-result');
            resultDiv.innerHTML = 'Test en cours...';
            
            try {
                const response = await fetch(API_BASE + '/livres?limit=5');
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="${response.ok ? 'success' : 'error'}">
                        Statut: ${response.status}
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        Erreur: ${error.message}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
