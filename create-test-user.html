<!DOCTYPE html>
<html>
<head>
    <title>Créer Utilisateur de Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; }
        input { padding: 8px; width: 300px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; margin-top: 10px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Créer un Utilisateur de Test</h1>
    
    <form id="userForm">
        <div class="form-group">
            <label>Nom:</label>
            <input type="text" id="nom" value="Test User" required>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" value="testuser@example.com" required>
        </div>
        <div class="form-group">
            <label>Mot de passe:</label>
            <input type="password" id="motDePasse" value="test123" required>
        </div>
        <button type="submit">Créer l'utilisateur</button>
    </form>
    
    <div id="result"></div>
    
    <h2>Tester la connexion</h2>
    <button onclick="testLogin()">Tester avec les identifiants ci-dessus</button>
    <div id="loginResult"></div>

    <script>
        const API_BASE = 'https://mabiblioth-queenligne.onrender.com/api';
        
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userData = {
                nom: document.getElementById('nom').value,
                email: document.getElementById('email').value,
                motDePasse: document.getElementById('motDePasse').value
            };
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Création en cours...';
            
            try {
                const response = await fetch(API_BASE + '/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="${response.ok ? 'success' : 'error'}">
                        Statut: ${response.status}
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Erreur: ${error.message}</div>`;
            }
        });
        
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('motDePasse').value;
            
            const resultDiv = document.getElementById('loginResult');
            resultDiv.innerHTML = 'Test de connexion en cours...';
            
            try {
                const response = await fetch(API_BASE + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, motDePasse: password })
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="${response.ok ? 'success' : 'error'}">
                        Statut: ${response.status}
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        ${response.ok && data.token ? `<p>Token reçu: ${data.token.substring(0, 50)}...</p>` : ''}
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Erreur: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
